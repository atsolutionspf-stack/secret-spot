name: Migrate Yarn lockfile

on:
  push:
    branches:
      - fix/admin-auth-loading-20261105
    paths:
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "frontend/.yarnrc.yml"
      - ".github/workflows/migrate-yarn-lock.yml"

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-loading-20261105
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate Yarn 4.9.1
        run: |
          corepack enable
          corepack prepare yarn@4.9.1 --activate
          yarn --version

      - name: Migrate lockfile to Yarn 4
        working-directory: frontend
        run: yarn install --mode=update-lockfile

      - name: Verify immutable install
        working-directory: frontend
        run: yarn install --immutable

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Commit migrated lockfile
        run: |
          if ! git diff --quiet -- frontend/yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/yarn.lock
            git commit -m "chore: migrate frontend lockfile to Yarn 4"
            git push origin HEAD:fix/admin-auth-loading-20261105
          else
            echo "Lockfile already up to date."
          fi

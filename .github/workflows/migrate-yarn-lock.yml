name: Refresh Yarn Classic lockfile

on:
  push:
    branches:
      - fix/admin-auth-loading-20261105
    paths:
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - ".github/workflows/migrate-yarn-lock.yml"

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-loading-20261105
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate Yarn Classic 1.22.22
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Refresh lockfile
        working-directory: frontend
        run: yarn install

      - name: Verify frozen install
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Commit updated lockfile
        run: |
          git pull --rebase origin fix/admin-auth-loading-20261105
          if ! git diff --quiet -- frontend/yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/yarn.lock
            git commit -m "chore: refresh frontend Yarn lockfile"
            git push origin HEAD:fix/admin-auth-loading-20261105
          else
            echo "Lockfile already up to date."
          fi
